name: Bug report
description: Report a reproducible non-security defect
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not disclose vulnerabilities here; follow SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include exact outcomes such as NotSent, Unknown, or recovery-required.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest contracts, workflow, commands, and restart sequence.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hermas version and commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Linux distribution, architecture, compiler, and sanitizer output.
