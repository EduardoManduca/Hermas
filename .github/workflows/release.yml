name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' compiler/hermas/Cargo.toml | head -1)" = "$GITHUB_REF_NAME"
      - run: tools/package_release.sh "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*-SHA256SUMS
