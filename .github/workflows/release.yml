name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  fuzz-smoke:
    permissions:
      contents: read
    uses: ./.github/workflows/fuzz.yml
    with:
      smoke: true

  package:
    needs: [gate, fuzz-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Verify release provenance
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          test "v$(sed -n 's/^version = "\(.*\)"/\1/p' compiler/hermas/Cargo.toml | head -1)" = "$GITHUB_REF_NAME"
      - run: tools/package_release.sh "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*-SHA256SUMS
