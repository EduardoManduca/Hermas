name: Fuzz

on:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo build -p hermas
      - run: tools/generate_test_fixtures.sh
      - name: Rust fuzz smoke
        if: github.event_name == 'pull_request'
        run: |
          cargo fuzz run image target/gate-fixtures -- -runs=500
          cargo fuzz run schema fuzz/seeds/schema -- -runs=500
          cargo fuzz run hscript fuzz/seeds/hscript -- -runs=500
      - name: Rust scheduled fuzz
        if: github.event_name != 'pull_request'
        run: |
          cargo fuzz run image target/gate-fixtures -- -max_total_time=300
          cargo fuzz run schema fuzz/seeds/schema -- -max_total_time=300
          cargo fuzz run hscript fuzz/seeds/hscript -- -max_total_time=300
      - run: cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang -DHERMAS_BUILD_FUZZERS=ON
      - run: cmake --build build-fuzz --target hermas_c_fuzz -j2
      - name: C fuzz smoke
        if: github.event_name == 'pull_request'
        run: build-fuzz/hermas_c_fuzz -runs=1000 target/gate-fixtures
      - name: C scheduled fuzz
        if: github.event_name != 'pull_request'
        run: build-fuzz/hermas_c_fuzz -max_total_time=600 target/gate-fixtures
